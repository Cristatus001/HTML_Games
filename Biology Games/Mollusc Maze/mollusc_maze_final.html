<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mollusc Maze - Second Largest Phylum</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Verdana', sans-serif;
            background: linear-gradient(135deg, #001219 0%, #005f73 100%);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        h1 {
            color: #94d2bd;
            text-shadow: 0 0 15px #0a9396;
            margin-top: 25px;
            font-size: 2.2rem;
        }

        .maze-container {
            position: relative;
            width: 95%;
            max-width: 1000px;
            height: 75vh;
            margin-top: 10px;
        }

        .riddle-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50%;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ee9b00;
            border-radius: 30px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 0 35px rgba(238, 155, 0, 0.4);
            z-index: 10;
        }

        #riddle-text {
            font-size: 1.25rem;
            margin-bottom: 25px;
            min-height: 70px;
            line-height: 1.4;
        }

        input {
            width: 85%;
            padding: 12px;
            border-radius: 50px;
            border: 2px solid #94d2bd;
            background: #fdf0d5;
            color: #001219;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        button {
            padding: 10px 25px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            margin: 0 5px;
        }

        .check-btn { background: #ee9b00; color: #fff; }
        .hint-btn { background: #0a9396; color: #fff; }

        .organism {
            position: absolute;
            width: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 4s ease-in-out infinite;
        }

        .circle-frame {
            width: 110px;
            height: 110px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #ee9b00;
            margin-bottom: 10px;
        }

        .organism span {
            background: #005f73;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        #pila { top: 0; left: 0; }
        #octopus { top: 0; right: 0; }
        #radula { bottom: 0; left: 0; }
        #hump { bottom: 0; right: 0; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <h1>🐚 MOLLUSC MAZE 🐚</h1>

    <div class="maze-container">
        <div class="organism" id="pila">
            <div class="circle-frame"><svg width="70" height="70" viewBox="0 0 24 24" fill="#8b5e3c"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6a6 6 0 1 0 6 6 6 6 0 0 0-6-6zm0 10a4 4 0 1 1 4-4 4 4 0 0 1-4 4z"/></svg></div>
            <span>Pila (Snail)</span>
        </div>

        <div class="organism" id="octopus">
            <div class="circle-frame"><svg width="70" height="70" viewBox="0 0 24 24" fill="#ae2012"><circle cx="12" cy="8" r="5"/><path d="M7 12c-2 1-3 3-3 5s2 3 4 3 4-1 4-3-2-4-5-5zM17 12c2 1 3 3 3 5s-2 3-4 3-4-1-4-3 2-4 5-5z"/></svg></div>
            <span>Octopus</span>
        </div>

        <div class="organism" id="radula">
            <div class="circle-frame"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#001219" stroke-width="2"><path d="M4 10h16M4 14h16M7 8l1 10M12 8l1 10M17 8l1 10"/></svg></div>
            <span>Radula</span>
        </div>

        <div class="organism" id="hump">
            <div class="circle-frame"><svg width="70" height="70" viewBox="0 0 24 24" fill="#0a9396"><path d="M12 3C7 3 3 7 3 12h18c0-5-4-9-9-9z"/><rect x="3" y="12" width="18" height="4" rx="2"/></svg></div>
            <span>Visceral Hump</span>
        </div>

        <div class="riddle-card">
            <div id="riddle-text">Loading...</div>
            <input type="text" id="user-input" placeholder="Enter answer here..." onkeypress="if(event.key==='Enter')checkAnswer()">
            <div>
                <button class="check-btn" onclick="checkAnswer()">Check Answer</button>
                <button class="hint-btn" onclick="showHint()">Hint</button>
            </div>
            <div id="feedback" style="margin-top:15px;"></div>
        </div>
    </div>

    <script>
        const riddles = [
            { q: "Our body is unsegmented with a head, visceral hump, and a muscular...?", a: "foot", hint: "It's what we use to move!" },
            { q: "I am a file-like rasping organ used for feeding. Who am I?", a: "radula", hint: "Look at the bottom-left icon." },
            { q: "What is our hard outer shell made of?", a: "calcareous", hint: "Think of calcium." },
            { q: "What do we call the space between the hump and the mantle?", a: "mantle cavity", hint: "This is where our gills live." }
        ];

        let idx = 0;
        function update() {
            document.getElementById('riddle-text').innerText = riddles[idx].q;
            document.getElementById('user-input').value = '';
            document.getElementById('feedback').innerText = '';
        }

        function checkAnswer() {
            const val = document.getElementById('user-input').value.toLowerCase().trim();
            if (val === riddles[idx].a) {
                document.getElementById('feedback').innerHTML = "✅ Correct!";
                idx++;
                setTimeout(() => { if (idx < riddles.length) update(); else alert("Maze Conquered!"); }, 1000);
            } else { document.getElementById('feedback').innerHTML = "❌ Try again!"; }
        }

        function showHint() { document.getElementById('feedback').innerText = "💡 " + riddles[idx].hint; }
        update();
    </script>
</body>
</html>
